<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chat AI Pro</title>

  <!-- ملف التصميم -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- أيقونة التطبيق -->
  <link
    rel="icon"
    type="image/png"
    href="icon.png"
  >
</head>

<body>

  <div class="app">

    <!-- الشريط العلوي -->
    <header class="topbar">

      <div class="brand">

        <div class="logo">
          AI
        </div>

        <div>
          <h1>Chat AI Pro</h1>

          <span>
            مساعدك الذكي
          </span>
        </div>

      </div>

      <button
        id="clearBtn"
        class="ghost"
        type="button"
      >
        محادثة جديدة
      </button>

    </header>


    <!-- منطقة المحادثة -->
    <main
      id="chat"
      class="chat"
    >

      <section class="welcome">

       <div class="welcome-icon">
  <img src="icon.png" alt="Chat AI Pro">
</div>

        <h2>
          مرحبًا بك في Chat AI Pro
        </h2>

        <p>
          اكتب سؤالك وسأحاول مساعدتك.
        </p>

      </section>

    </main>


    <!-- منطقة كتابة الرسالة -->
    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="message"
          rows="1"
          placeholder="اكتب رسالتك هنا..."
          autocomplete="off"
        ></textarea>

        <button
          id="sendBtn"
          class="send"
          type="button"
          aria-label="إرسال"
        >
          ➤
        </button>

      </div>

      <small>
        لا تضع مفتاح API داخل هذا الموقع أو GitHub.
      </small>

    </div>

  </div>


  <!-- ملف JavaScript -->
  <script src="script.js"></script>

</body>

</html>
