<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chat AI Pro</title>

  <link
    rel="icon"
    type="image/png"
    href="/icon.png"
  >

  <!-- CSS الخارجي -->
  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- ==================================================
       LOGIN
  ================================================== -->

  <section id="loginPage">

    <div class="login-card">

      <div class="logo-wrapper">

        <img
          id="loginLogo"
          class="app-logo"
          src="/icon.png"
          alt="Chat AI Pro"
          onerror="handleLogoError(this)"
        >

        <div
          id="logoFallback"
          class="logo-fallback"
        >
          AI
        </div>

        <div class="app-title">
          Chat AI Pro
        </div>

        <div class="app-subtitle">
          سجّل الدخول باستخدام رقم هاتفك
        </div>

      </div>


      <!-- PHONE -->

      <div id="phoneSection">

        <div class="form-group">

          <label for="phoneInput">
            رقم الهاتف
          </label>

          <input
            id="phoneInput"
            class="input"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="+9665XXXXXXXX"
          >

        </div>


        <button
          id="sendOtpButton"
          class="main-button"
          type="button"
        >
          إرسال رمز التحقق
        </button>

      </div>


      <!-- OTP -->

      <div
        id="otpSection"
        class="hidden"
      >

        <div class="form-group">

          <label for="otpInput">
            رمز التحقق
          </label>

          <input
            id="otpInput"
            class="input"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="10"
            placeholder="أدخل الرمز الذي وصلك على WhatsApp"
          >

        </div>


        <button
          id="verifyOtpButton"
          class="main-button"
          type="button"
        >
          تأكيد الرمز
        </button>


        <button
          id="backToPhoneButton"
          class="back-button"
          type="button"
        >
          تغيير رقم الهاتف
        </button>

      </div>


      <div
        id="authMessage"
        class="message"
      ></div>

    </div>

  </section>


  <!-- ==================================================
       APP
  ================================================== -->

  <section id="appPage">

    <div class="app-layout">


      <!-- SIDEBAR -->

      <aside class="sidebar">

        <div class="sidebar-logo">

          <img
            src="/icon.png"
            alt="Chat AI Pro"
          >

          <span>
            Chat AI Pro
          </span>

        </div>


        <button
          id="newChatButton"
          class="new-chat"
          type="button"
        >
          + محادثة جديدة
        </button>


        <div class="history-title">
          المحادثات السابقة
        </div>


        <div
          id="history"
          class="history"
        ></div>


        <button
          id="logoutButton"
          class="logout"
          type="button"
        >
          تسجيل الخروج
        </button>

      </aside>


      <!-- CHAT -->

      <main class="chat-area">


        <header class="topbar">

          <div class="topbar-title">
            Chat AI Pro
          </div>

        </header>


        <div
          id="messages"
          class="messages"
        >

          <div
            id="emptyChat"
            class="empty-chat"
          >

            <div>

              <h2>
                مرحبًا بك في Chat AI Pro
              </h2>

              <p>
                اكتب رسالتك لبدء المحادثة مع الذكاء الاصطناعي.
              </p>

            </div>

          </div>

        </div>


        <!-- COMPOSER -->

        <div class="composer">

          <div class="composer-inner">

            <input
              id="chatInput"
              class="chat-input"
              type="text"
              autocomplete="off"
              placeholder="اكتب رسالتك..."
            >

            <button
              id="sendChatButton"
              class="send-button"
              type="button"
            >
              ➤
            </button>

          </div>


          <div
            id="chatStatus"
            class="status"
          ></div>

        </div>

      </main>

    </div>

  </section>


  <!-- JavaScript -->
  <script
    type="module"
    src="/script.js"
  ></script>

</body>
</html>
