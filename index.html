<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anas AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">AI</div>
        <div>
          <h1>Anas AI</h1>
          <span>مساعدك الذكي</span>
        </div>
      </div>
      <button id="clearBtn" class="ghost">محادثة جديدة</button>
    </header>

    <main id="chat" class="chat">
      <section class="welcome">
        <div class="welcome-icon">✦</div>
        <h2>مرحبًا بك في Anas AI</h2>
        <p>اكتب سؤالك وسأحاول مساعدتك.</p>
      </section>
    </main>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="message" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
        <button id="sendBtn" class="send" aria-label="إرسال">➤</button>
      </div>
      <small>لا تضع مفتاح API داخل هذا الموقع أو GitHub.</small>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
