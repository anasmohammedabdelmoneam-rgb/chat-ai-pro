<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat AI Pro</title>

  <link rel="icon" href="/logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 200, 255, .18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(80, 50, 255, .18), transparent 30%),
        linear-gradient(135deg, #02030a, #06152c, #02030a);
      color: white;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* ================= LOGIN ================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 28px;
      background: rgba(10, 20, 40, .62);
      border: 1px solid rgba(100, 210, 255, .25);
      backdrop-filter: blur(25px);
      box-shadow:
        0 0 50px rgba(0, 180, 255, .12),
        inset 0 0 30px rgba(255,255,255,.03);
      text-align: center;
    }

    .logo {
      width: 115px;
      height: 115px;
      object-fit: cover;
      border-radius: 25px;
      margin-bottom: 18px;
      box-shadow: 0 0 35px rgba(0, 200, 255, .25);
    }

    .login-card h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .login-card p {
      color: #aebbd0;
      margin-bottom: 25px;
    }

    .input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      outline: none;
      background: rgba(255,255,255,.06);
      color: white;
      font-size: 16px;
    }

    .input:focus {
      border-color: #38cfff;
      box-shadow: 0 0 15px rgba(56,207,255,.15);
    }

    .primary-btn {
      width: 100%;
      border: 0;
      padding: 15px;
      border-radius: 14px;
      background: linear-gradient(135deg, #08bfff, #4264ff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(20,160,255,.25);
    }

    .status {
      margin-top: 15px;
      min-height: 22px;
      color: #8ddcff;
      font-size: 14px;
    }

    /* ================= APP ================= */

    #appScreen {
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 290px;
      height: 100vh;
      background: rgba(3, 10, 23, .72);
      border-left: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(25px);
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .sidebar-header img {
      width: 45px;
      height: 45px;
      border-radius: 13px;
    }

    .sidebar-header strong {
      font-size: 18px;
    }

    .new-chat {
      border: 1px solid rgba(70,210,255,.25);
      background: rgba(20,150,255,.10);
      color: white;
      padding: 13px;
      border-radius: 13px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 7px;
      cursor: pointer;
      color: #dce8f8;
      background: transparent;
      display: flex;
      justify-content: space-between;
      gap: 5px;
    }

    .history-item:hover,
    .history-item.active {
      background: rgba(255,255,255,.07);
    }

    .history-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-chat {
      border: 0;
      background: transparent;
      color: #7890aa;
      cursor: pointer;
    }

    .account-box {
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 15px;
      margin-top: 15px;
    }

    .account-phone {
      font-size: 13px;
      color: #9eb1c9;
      margin-bottom: 10px;
      direction: ltr;
      text-align: center;
    }

    .logout {
      width: 100%;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04);
      color: white;
      padding: 11px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* ================= CHAT ================= */

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 25px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.12);
      backdrop-filter: blur(15px);
    }

    .topbar-title {
      font-size: 20px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
    }

    .welcome {
      text-align: center;
      margin-top: 13vh;
      color: #aebbd0;
    }

    .welcome h2 {
      color: white;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.assistant {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 15px 18px;
      border-radius: 18px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: linear-gradient(135deg, #087fff, #3157ff);
    }

    .assistant .bubble {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
    }

    .composer {
      padding: 18px 25px 25px;
    }

    .composer-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      padding: 8px;
      backdrop-filter: blur(20px);
    }

    #messageInput {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 150px;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      padding: 13px;
      font-size: 16px;
    }

    #sendButton {
      width: 52px;
      height: 52px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #00c9ff, #4357ff);
      color: white;
      cursor: pointer;
      font-size: 20px;
    }

    @media (max-width: 750px) {
      .sidebar {
        width: 220px;
      }

      .messages {
        padding: 18px 12px;
      }

      .bubble {
        max-width: 90%;
      }
    }

    @media (max-width: 600px) {
      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 15px;
      }

      .composer {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= LOGIN ================= -->

  <section id="loginScreen">

    <div class="login-card">

      <img src="/logo.png" class="logo" alt="Chat AI Pro">

      <h1>Chat AI Pro</h1>
      <p>سجّل الدخول باستخدام رقم هاتفك</p>

      <div id="phoneStep">

        <input
          id="phoneInput"
          class="input"
          type="tel"
          placeholder="+9665XXXXXXXX"
          autocomplete="tel"
        >

        <button
          id="sendOtpButton"
          class="primary-btn"
        >
          إرسال رمز التحقق
        </button>

      </div>

      <div id="otpStep" class="hidden">

        <input
          id="otpInput"
          class="input"
          type="text"
          inputmode="numeric"
          maxlength="8"
          placeholder="أدخل رمز التحقق"
        >

        <button
          id="verifyOtpButton"
          class="primary-btn"
        >
          تأكيد الرمز
        </button>

        <button
          id="backToPhoneButton"
          class="logout"
          style="margin-top:10px"
        >
          تغيير رقم الهاتف
        </button>

      </div>

      <div id="loginStatus" class="status"></div>

    </div>

  </section>


  <!-- ================= APP ================= -->

  <section id="appScreen" class="hidden">

    <aside class="sidebar">

      <div class="sidebar-header">
        <img src="/logo.png" alt="">
        <strong>Chat AI Pro</strong>
      </div>

      <button id="newChatButton" class="new-chat">
        ＋ محادثة جديدة
      </button>

      <div id="historyList" class="history"></div>

      <div class="account-box">

        <div id="accountPhone" class="account-phone"></div>

        <button id="logoutButton" class="logout">
          تسجيل الخروج
        </button>

      </div>

    </aside>


    <main class="chat-area">

      <header class="topbar">
        <div id="chatTitle" class="topbar-title">
          محادثة جديدة
        </div>
      </header>

      <div id="messages" class="messages">

        <div class="welcome">
          <h2>مرحبًا بك في Chat AI Pro 👋</h2>
          <p>اكتب أي شيء تريد أن تسأل عنه.</p>
        </div>

      </div>


      <div class="composer">

        <div class="composer-inner">

          <textarea
            id="messageInput"
            placeholder="اكتب رسالتك..."
            rows="1"
          ></textarea>

          <button id="sendButton">
            ➤
          </button>

        </div>

      </div>

    </main>

  </section>


  <!-- Firebase -->
  <script type="module" src="/script.js"></script>

</body>
</html>
